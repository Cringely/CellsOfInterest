title: "Cells of Interest"
description: "Tints the cells a building is about to use, while you are still placing it: where a duplicant stands to work it, and where its gas, liquid, or solid output lands. Cells that are two things at once split into stripes. Optional pipe-port and heat-exchange tints, and every class can be turned off under Mods, Options."
staticID: CellsOfInterest
